name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check release tag
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag not in {version, f"v{version}"}:
              raise SystemExit(f"release tag {tag!r} does not match version {version!r}")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check generated resources
        run: python generate.py --check
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/sage-data-elliptic-curves-smoke
          /tmp/sage-data-elliptic-curves-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/sage-data-elliptic-curves-smoke/bin/python - <<'PY'
          from sage_data_elliptic_curves import available_ranks, cremona_mini_connection

          assert len(available_ranks()) == 23
          with cremona_mini_connection() as connection:
              assert connection.execute("PRAGMA integrity_check").fetchone() == ("ok",)
              assert connection.execute("SELECT count(*) FROM t_curve").fetchone() == (64687,)
          PY
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Attach distributions to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Upload distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  pypi:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sage-data-elliptic-curves
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
